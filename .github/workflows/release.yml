# Instaladores do PRISMA! — Linux (.deb) e Windows (.exe, Inno Setup).
#   tag v*  (git tag v0.2.0 && git push origin v0.2.0) -> testa, gera .deb + .exe + zip portatil e publica a
#           Release (tag com '-', ex. v0.1.0-beta.1 = pre-lancamento);
#           o app instalado compara a versao dele com a ultima Release ao abrir (packaging/updater.py)
#   push numa branch mexendo no empacotamento / manual  -> so' gera, como artefatos (sem Release)
name: release
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['packaging/**', '.github/workflows/**', 'src/plat.py', 'requirements.txt']   # (tag ignora paths)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04          # glibc mais velha = roda no 22.04/24.04 (Mint 21/22)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y fakeroot ffmpeg
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: self-checks
        run: |
          python src/plat.py
          python src/dash_data.py
          python src/dash_server.py
          python src/telao_sim.py --selfcheck
          python src/native_synth.py --selfcheck
          python packaging/updater.py
          python packaging/check_imports.py
      - name: .deb
        env:
          PYTHON: python
          PRISMA_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: packaging/deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: 'dist/*.deb' }

  windows:
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: ffmpeg (vai dentro do instalador)
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d ffmpeg-dl
          B=$(ls -d "$PWD"/ffmpeg-dl/*/bin)
          echo "FFMPEG_DIR=$B" >> "$GITHUB_ENV"
          cygpath -w "$B" >> "$GITHUB_PATH"        # PATH do runner quer caminho Windows
      - name: self-checks
        run: |
          python src/plat.py
          python src/dash_data.py
          python src/dash_server.py
          python src/native_synth.py --selfcheck
          python packaging/updater.py
          python packaging/check_imports.py
          python -c "import pyaudiowpatch, cv2, pygame, OpenGL.GL; print('imports ok')"
      - name: dist/prisma
        env:
          PYTHON: python
          PRISMA_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: packaging/build.sh
      - name: smoke (o .exe abre, sobe o dash e responde)
        run: |
          export PRISMA_NO_BROWSER=1 PRISMA_NO_UPDATE=1 PRISMA_HOME="$RUNNER_TEMP/prisma-home"
          ./dist/prisma/prisma.exe &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/outputs && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/outputs || { cat "$PRISMA_HOME/prisma.log"; exit 1; }
          echo; cat "$PRISMA_HOME/prisma.log" | tail -20
          taskkill //IM prisma.exe //F || true
        continue-on-error: true      # runner sem GPU de verdade: OpenGL pode nao abrir; o log fica no job
      - name: instalador (Inno Setup)
        run: |
          V=$(cat dist/prisma/VERSION); V=${V#v}; [[ "$V" =~ ^[0-9] ]] || V="0.0.0"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion="$V" //DSrcDir="$(cygpath -w "$PWD/dist/prisma")" \
            //DOutDir="$(cygpath -w "$PWD/dist")" "$(cygpath -w packaging/prisma.iss)"
      - name: zip portatil (sem instalar; dados ficam dentro da pasta)
        run: |
          V=$(cat dist/prisma/VERSION); V=${V#v}
          mkdir -p dist/portatil && cp -r dist/prisma dist/portatil/PRISMA
          printf '%s\r\n' 'PRISMA! portatil - abra o prisma.exe.' \
            'Este arquivo faz o PRISMA guardar sets, midias e ajustes na pasta "dados" aqui do lado' \
            '(nada vai pro computador). Apague a pasta inteira pra remover tudo.' > dist/portatil/PRISMA/portable.txt
          (cd dist/portatil && 7z a -tzip -bso0 "../PRISMA-$V-windows-portatil.zip" PRISMA)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-windows-portatil.zip

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}   # v0.1.0-beta.1: nao vira a "ultima" (o updater ignora)
