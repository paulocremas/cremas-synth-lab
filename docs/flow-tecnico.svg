<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 995" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="995" fill="#0d1117"/>

  <!-- ================= containers ================= -->
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="20"  y="20"  width="385" height="685" rx="8"/>
    <rect x="435" y="250" width="365" height="455" rx="8"/>
    <rect x="820" y="20"  width="360" height="685" rx="8"/>
    <rect x="505" y="725" width="210" height="175" rx="8"/>
  </g>
  <g font-size="14" font-weight="600" fill="#8b949e">
    <text x="36"  y="44">áudio</text>
    <text x="451" y="274">Visualização</text>
    <text x="836" y="44">imagem</text>
    <text x="518" y="749">shader (hot-reload por mtime)</text>
  </g>

  <!-- ================= edges ================= -->
  <!-- solid: fluxo de dados / chamada OpenGL -->
  <g fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)">
    <path d="M165,126 V190"/>
    <path d="M165,244 V310"/>
    <path d="M165,380 V470"/>
    <path d="M165,524 V596"/>
    <path d="M1000,118 V164"/>
    <path d="M1000,218 V264"/>
    <path d="M1000,316 V362"/>
    <path d="M968,414 L945,462"/>
    <path d="M1070,388 H1114 V648"/>
    <path d="M940,518 V562"/>
    <path d="M940,616 V648"/>
    <path d="M165,650 V860 H524"/>
    <path d="M943,702 V846 H696"/>
    <path d="M1114,702 V874 H696"/>
    <path d="M610,888 V928"/>
  </g>

  <!-- dashed grey: leitura para dashboard (dead-end) -->
  <g fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arg)">
    <path d="M375,345 H410 V599 H435"/>
    <path d="M930,388 H784"/>
    <path d="M852,589 H805 V405 H784"/>
  </g>

  <!-- dashed blue: hot-reload (mtime) -->
  <g fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arb)">
    <path d="M355,244 V310"/>
    <path d="M610,810 V832"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#8b949e">
    <text x="363" y="282" fill="#58a6ff">mtime</text>
    <text x="340" y="852" text-anchor="middle">glUniform1f × 13</text>
    <text x="800" y="838" text-anchor="middle">glUniform3f</text>
    <text x="884" y="868" text-anchor="middle">glTexImage2D</text>
  </g>

  <!-- ================= nodes ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <rect x="45"   y="64"  width="280" height="62" rx="6"/>
    <rect x="45"   y="190" width="240" height="54" rx="6"/>
    <rect x="310"  y="190" width="90"  height="54" rx="6"/>
    <rect x="45"   y="310" width="330" height="70" rx="6"/>
    <rect x="45"   y="470" width="245" height="54" rx="6"/>
    <rect x="45"   y="596" width="245" height="54" rx="6"/>

    <rect x="452"  y="315" width="330" height="108" rx="6"/>
    <rect x="452"  y="558" width="330" height="82"  rx="6"/>

    <rect x="885"  y="64"  width="230" height="54" rx="6"/>
    <rect x="885"  y="164" width="230" height="54" rx="6"/>
    <rect x="895"  y="264" width="210" height="52" rx="6"/>
    <rect x="930"  y="362" width="140" height="52" rx="6"/>
    <rect x="828"  y="462" width="224" height="56" rx="6"/>
    <rect x="852"  y="562" width="176" height="54" rx="6"/>
    <rect x="868"  y="648" width="150" height="54" rx="6"/>
    <rect x="1052" y="648" width="124" height="54" rx="6"/>

    <rect x="533"  y="760" width="154" height="50" rx="6"/>
    <rect x="524"  y="832" width="172" height="56" rx="6"/>
    <rect x="485"  y="928" width="250" height="54" rx="6"/>
  </g>

  <g font-size="13" fill="#e6edf3" text-anchor="middle">
    <text x="185" y="90">entrada de áudio<tspan x="185" dy="18">(monitor do sistema)</tspan></text>
    <text x="165" y="222">captura de áudio (parec)</text>
    <text x="355" y="222">tuning.py</text>
    <text x="210" y="338">thread de áudio<tspan x="210" dy="18">FFT + faixas + kick + suavização</tspan></text>
    <text x="167" y="502">state['amp'] … state['kick']</text>
    <text x="167" y="628">u_amp … u_air, u_kick</text>

    <text x="617" y="345">imagem · gnome-terminal<tspan x="617" dy="20">brilho, cor, bordas, movimento…</tspan><tspan x="617" dy="20">redraw ~230 ms (no ritmo do áudio)</tspan></text>
    <text x="617" y="590">áudio · stdout<tspan x="617" dy="20">kick + faixas + espectrograma</tspan></text>

    <text x="1000" y="95">entrada de imagem (OBS)</text>
    <text x="1000" y="195">captura de vídeo (FFMPEG)</text>
    <text x="1000" y="294">thread de vídeo</text>
    <text x="1000" y="393">state['frame']</text>
    <text x="940" y="495">dominant_color_thread (~10/s)</text>
    <text x="940" y="594">state['dominant']</text>
    <text x="943" y="680">u_dominant</text>
    <text x="1114" y="680">u_texture_0</text>

    <text x="610" y="791">image.frag (arquivo)</text>
    <text x="610" y="858">image.frag na GPU<tspan x="610" dy="18">1× por pixel</tspan></text>
    <text x="610" y="960">pygame · 30 fps → janela / monitor</text>
  </g>

  <!-- ================= legenda ================= -->
  <g font-size="11" fill="#8b949e">
    <line x1="890" y1="932" x2="924" y2="932" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="934" y="936">fluxo de dados / chamada OpenGL</text>
    <line x1="890" y1="956" x2="924" y2="956" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arg)"/>
    <text x="934" y="960">leitura p/ Visualização (dead-end)</text>
    <line x1="890" y1="980" x2="924" y2="980" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <text x="934" y="984">hot-reload (mtime)</text>
  </g>
</svg>
