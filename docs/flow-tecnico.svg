<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 745" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="745" fill="#ffffff"/>

  <!-- ================= containers ================= -->
  <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5">
    <rect x="20"  y="20"  width="360" height="450" rx="8"/>
    <rect x="410" y="205" width="360" height="265" rx="8"/>
    <rect x="800" y="20"  width="360" height="450" rx="8"/>
    <rect x="495" y="514" width="196" height="150" rx="8"/>
  </g>
  <g font-size="12" font-weight="600" fill="#57606a">
    <text x="34"  y="40">áudio</text>
    <text x="424" y="225">dashboards</text>
    <text x="814" y="40">imagem</text>
    <text x="506" y="532">shader (hot-reload por mtime)</text>
  </g>

  <!-- ================= edges ================= -->
  <!-- solid: fluxo de dados / chamada OpenGL -->
  <g fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)">
    <path d="M150,96 V132"/>
    <path d="M150,172 V214"/>
    <path d="M150,268 V314"/>
    <path d="M150,354 V394"/>
    <path d="M980,94 V120"/>
    <path d="M980,164 V190"/>
    <path d="M980,230 V256"/>
    <path d="M948,296 L910,314"/>
    <path d="M1045,272 H1091 V426"/>
    <path d="M904,358 V378"/>
    <path d="M903,418 V426"/>
    <path d="M150,434 V628 H513"/>
    <path d="M903,466 V614 H677"/>
    <path d="M1091,466 V640 H677"/>
    <path d="M595,652 V690"/>
  </g>

  <!-- dashed grey: leitura para dashboard (dead-end) -->
  <g fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arg)">
    <path d="M340,241 H398 V389 H430"/>
    <path d="M915,272 H752"/>
    <path d="M828,396 H782 V304 H752"/>
  </g>

  <!-- dashed blue: hot-reload (mtime) -->
  <g fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arb)">
    <path d="M317,172 V214"/>
    <path d="M595,584 V606"/>
  </g>

  <!-- edge labels -->
  <g font-size="10" fill="#57606a">
    <text x="323" y="196" fill="#0969da">mtime</text>
    <text x="310" y="622" text-anchor="middle">glUniform1f × 13</text>
    <text x="762" y="608" text-anchor="middle">glUniform3f</text>
    <text x="846" y="634" text-anchor="middle">glTexImage2D</text>
  </g>

  <!-- ================= nodes ================= -->
  <g fill="#ffffff" stroke="#57606a" stroke-width="1.5">
    <rect x="45"   y="50"  width="250" height="46" rx="6"/>
    <rect x="45"   y="132" width="210" height="40" rx="6"/>
    <rect x="272"  y="132" width="90"  height="40" rx="6"/>
    <rect x="45"   y="214" width="295" height="54" rx="6"/>
    <rect x="45"   y="314" width="210" height="40" rx="6"/>
    <rect x="45"   y="394" width="210" height="40" rx="6"/>

    <rect x="430"  y="246" width="320" height="82" rx="6"/>
    <rect x="430"  y="360" width="320" height="58" rx="6"/>

    <rect x="875"  y="50"  width="210" height="44" rx="6"/>
    <rect x="875"  y="120" width="210" height="44" rx="6"/>
    <rect x="885"  y="190" width="190" height="40" rx="6"/>
    <rect x="915"  y="256" width="130" height="40" rx="6"/>
    <rect x="806"  y="314" width="196" height="44" rx="6"/>
    <rect x="828"  y="378" width="150" height="40" rx="6"/>
    <rect x="843"  y="426" width="120" height="40" rx="6"/>
    <rect x="1035" y="426" width="112" height="40" rx="6"/>

    <rect x="520"  y="544" width="150" height="40" rx="6"/>
    <rect x="513"  y="606" width="164" height="46" rx="6"/>
    <rect x="505"  y="690" width="182" height="44" rx="6"/>
  </g>

  <g font-size="11" fill="#1f2328" text-anchor="middle">
    <text x="170" y="70">entrada de áudio<tspan x="170" dy="15">(monitor do sistema)</tspan></text>
    <text x="150" y="156">captura de áudio (parec)</text>
    <text x="317" y="156">tuning.py</text>
    <text x="192" y="234">thread de áudio<tspan x="192" dy="15">FFT + faixas + kick + suavização</tspan></text>
    <text x="150" y="338">state['amp'] … state['kick']</text>
    <text x="150" y="418">u_amp … u_air, u_kick</text>

    <text x="590" y="270">imagem · gnome-terminal<tspan x="590" dy="16">brilho, cor, bordas, movimento…</tspan><tspan x="590" dy="16">redraw ~230 ms (no ritmo do áudio)</tspan></text>
    <text x="590" y="384">áudio · stdout<tspan x="590" dy="16">kick + faixas + espectrograma</tspan></text>

    <text x="980" y="77">entrada de imagem (OBS)</text>
    <text x="980" y="147">captura de vídeo (FFMPEG)</text>
    <text x="980" y="214">thread de vídeo</text>
    <text x="980" y="280">state['frame']</text>
    <text x="904" y="340">dominant_color_thread (~10/s)</text>
    <text x="903" y="402">state['dominant']</text>
    <text x="903" y="450">u_dominant</text>
    <text x="1091" y="450">u_texture_0</text>

    <text x="595" y="568">image.frag (arquivo)</text>
    <text x="595" y="626">image.frag na GPU<tspan x="595" dy="15">1× por pixel</tspan></text>
    <text x="596" y="716">pygame · 30 fps → janela / monitor</text>
  </g>

  <!-- ================= legenda ================= -->
  <g font-size="10" fill="#57606a">
    <line x1="880" y1="693" x2="912" y2="693" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="920" y="696">fluxo de dados / chamada OpenGL</text>
    <line x1="880" y1="712" x2="912" y2="712" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arg)"/>
    <text x="920" y="715">leitura p/ dashboard (dead-end)</text>
    <line x1="880" y1="731" x2="912" y2="731" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arb)"/>
    <text x="920" y="734">hot-reload (mtime)</text>
  </g>
</svg>
