<svg xmlns="http://www.w3.org/2000/svg" width="780" height="866" viewBox="0 0 780 866" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="866" fill="#0d1117"/>

  <!-- ================= containers ================= -->
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="10"  y="12"  width="244" height="488" rx="8"/>
    <rect x="266" y="168" width="244" height="140" rx="8"/>
    <rect x="522" y="12"  width="248" height="488" rx="8"/>
  </g>
  <g font-size="17" font-weight="600" fill="#8b949e">
    <text x="22"  y="34">áudio</text>
    <text x="278" y="190">Visualização</text>
    <text x="534" y="34">imagem</text>
  </g>

  <!-- ================= legenda de formas ================= -->
  <rect x="262" y="18" width="252" height="142" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <g stroke="#7d8590" stroke-width="1.4" fill="#21262d">
    <rect x="272" y="34" width="22" height="12" rx="6"/>
    <rect x="272" y="55" width="22" height="12" rx="3"/>
    <path d="M272,76 h22 v8 c-5,3 -11,-3 -22,1 z"/>
    <path d="M273,96 v8 a10,3 0 0 0 20,0 v-8"/>
    <ellipse cx="283" cy="96" rx="10" ry="3"/>
    <path d="M276,116 h12 l4,6 -4,6 h-12 l-4,-6 z"/>
  </g>
  <rect x="272" y="138" width="22" height="12" rx="3" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="3 2"/>
  <g font-size="12.5" fill="#8b949e">
    <text x="304" y="44">fonte externa · saída</text>
    <text x="304" y="65">processo · thread · loop</text>
    <text x="304" y="86">arquivo (hot-reload)</text>
    <text x="304" y="107">dado em memória (state / uniform)</text>
    <text x="304" y="128">programa na GPU</text>
    <text x="304" y="149">Visualização (só leitura)</text>
  </g>

  <!-- ================= edges ================= -->
  <!-- solid: fluxo de dados / chamada OpenGL -->
  <g fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M132,88 V114"/>
    <path d="M132,156 V188"/>
    <path d="M132,242 V410"/>
    <path d="M646,86 V110"/>
    <path d="M646,152 V178"/>
    <path d="M646,220 V244"/>
    <path d="M622,292 L608,318"/>
    <path d="M636,366 V392"/>
    <path d="M132,462 V546"/>
    <path d="M714,264 H774 V568 H696"/>
    <path d="M636,442 V546"/>
    <path d="M168,592 V624"/>
    <path d="M390,592 V624"/>
    <path d="M590,592 V624"/>
    <path d="M168,672 V735 H300"/>
    <path d="M390,672 V706"/>
    <path d="M590,672 V735 H500"/>
    <path d="M400,764 V798"/>
  </g>

  <!-- dashed grey: leitura para a Visualização (dead-end) -->
  <g fill="none" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arg)">
    <path d="M244,215 H256 V258 H266"/>
    <path d="M594,268 H498"/>
    <path d="M548,417 H510 V262 H498"/>
  </g>

  <!-- dashed blue: hot-reload (mtime) -->
  <g fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)">
    <path d="M209,156 V188"/>
    <path d="M372,532 V546"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#8b949e" text-anchor="middle">
    <text x="209" y="150" fill="#58a6ff">mtime</text>
    <text x="392" y="544" fill="#58a6ff" text-anchor="start">mtime</text>
    <text x="168" y="614">glUniform1f × 13</text>
    <text x="390" y="614">glTexImage2D</text>
    <text x="590" y="614">glUniform3f</text>
  </g>

  <!-- ================= nós: estádio / pill (fonte · saída) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <rect x="22"  y="36"  width="220" height="52" rx="26"/>
    <rect x="530" y="36"  width="232" height="50" rx="25"/>
    <rect x="292" y="798" width="216" height="46" rx="23"/>
  </g>

  <!-- ================= nós: retângulo arredondado (processo · thread · loop) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <rect x="24"  y="114" width="132" height="42" rx="8"/>
    <rect x="24"  y="188" width="220" height="54" rx="8"/>
    <rect x="530" y="110" width="232" height="42" rx="8"/>
    <rect x="538" y="178" width="216" height="42" rx="8"/>
    <rect x="528" y="318" width="236" height="48" rx="8"/>
    <rect x="60"  y="546" width="636" height="46" rx="10"/>
  </g>

  <!-- ================= nós: documento (arquivo) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <path d="M170,114 H248 V150 C226,159 202,143 170,154 Z"/>
    <path d="M312,488 H432 V526 C406,535 378,519 312,530 Z"/>
  </g>

  <!-- ================= nós: cilindro (dado) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <path d="M28,417 V455 A102,7 0 0 0 232,455 V417"/><ellipse cx="130" cy="417" rx="102" ry="7"/>
    <path d="M594,251 V285 A60,7 0 0 0 714,285 V251"/><ellipse cx="654" cy="251" rx="60" ry="7"/>
    <path d="M548,399 V435 A88,7 0 0 0 724,435 V399"/><ellipse cx="636" cy="399" rx="88" ry="7"/>
    <path d="M70,631 V667 A98,7 0 0 0 266,667 V631"/><ellipse cx="168" cy="631" rx="98" ry="7"/>
    <path d="M312,631 V667 A78,7 0 0 0 468,667 V631"/><ellipse cx="390" cy="631" rx="78" ry="7"/>
    <path d="M512,631 V667 A78,7 0 0 0 668,667 V631"/><ellipse cx="590" cy="631" rx="78" ry="7"/>
  </g>

  <!-- ================= nó: hexágono (programa na GPU) ================= -->
  <path d="M320,706 H480 L500,735 L480,764 H320 L300,735 Z" fill="#21262d" stroke="#7d8590" stroke-width="1.5"/>

  <!-- ================= nós: Visualização (tracejado, esmaecido) ================= -->
  <g fill="#21262d" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7">
    <rect x="280" y="198" width="218" height="44" rx="8"/>
    <rect x="280" y="254" width="218" height="42" rx="8"/>
  </g>

  <!-- ================= textos dos nós ================= -->
  <g fill="#e6edf3" text-anchor="middle">
    <g font-size="16">
      <text x="132" y="58">entrada de áudio</text>
      <text x="90"  y="141">captura (parec)</text>
      <text x="132" y="212">thread de áudio</text>
      <text x="646" y="66">entrada de imagem (OBS)</text>
      <text x="646" y="137">captura (FFMPEG)</text>
      <text x="646" y="205">thread de vídeo</text>
      <text x="378" y="575">loop principal · 30 fps</text>
      <text x="400" y="827">pygame → janela / monitor</text>
      <text x="209" y="140">tuning.py</text>
      <text x="390" y="653">u_texture_0</text>
      <text x="590" y="653">u_dominant</text>
      <text x="400" y="732">image.frag na GPU</text>
      <text x="389" y="225">imagem · gnome-terminal</text>
      <text x="389" y="281">áudio · stdout</text>
    </g>
    <g font-size="14">
      <text x="130" y="441">state['amp'] … state['kick']</text>
      <text x="654" y="273">state['frame']</text>
      <text x="636" y="421">state['dominant']</text>
      <text x="646" y="347">dominant_color_thread (~10/s)</text>
      <text x="168" y="655">u_amp … u_air, u_kick</text>
      <text x="372" y="506">image.frag<tspan x="372" dy="15">(arquivo)</tspan></text>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="132" y="78">(monitor do sistema)</text>
      <text x="132" y="232">FFT · bandas · kick · suavização</text>
      <text x="400" y="750">1× por pixel</text>
    </g>
  </g>

  <!-- ================= legenda de setas ================= -->
  <g font-size="12.5" fill="#8b949e">
    <line x1="520" y1="798" x2="550" y2="798" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="558" y="802">fluxo de dados / chamada GL</text>
    <line x1="520" y1="820" x2="550" y2="820" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <text x="558" y="824">hot-reload (mtime)</text>
    <line x1="520" y1="842" x2="550" y2="842" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arg)"/>
    <text x="558" y="846">leitura p/ Visualização</text>
  </g>
</svg>
