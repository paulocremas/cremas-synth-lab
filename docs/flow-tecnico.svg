<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 966 900" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="966" height="900" fill="#0d1117"/>

  <!-- ================= containers ================= -->
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="16"  y="14"  width="280" height="476" rx="8"/>
    <rect x="316" y="186" width="270" height="146" rx="8"/>
    <rect x="606" y="14"  width="300" height="476" rx="8"/>
  </g>
  <g font-size="17" font-weight="600" fill="#8b949e">
    <text x="30"  y="38">áudio</text>
    <text x="328" y="210">Visualização</text>
    <text x="620" y="38">imagem</text>
  </g>

  <!-- ================= legenda de formas ================= -->
  <rect x="304" y="24" width="298" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <g stroke="#7d8590" stroke-width="1.4" fill="#21262d">
    <rect x="312" y="42" width="24" height="13" rx="6.5"/>
    <rect x="312" y="64" width="24" height="13" rx="3"/>
    <path d="M312,86 h24 v9 c-6,3 -12,-3 -24,1 z"/>
    <path d="M313,107 v9 a11,3 0 0 0 22,0 v-9"/>
    <ellipse cx="324" cy="107" rx="11" ry="3"/>
    <path d="M316,128 h13 l4,6 -4,6 h-13 l-4,-6 z"/>
  </g>
  <rect x="312" y="150" width="24" height="13" rx="3" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="3 2"/>
  <g font-size="11.5" fill="#8b949e">
    <text x="346" y="53">fonte externa · saída</text>
    <text x="346" y="75">processo · thread · loop</text>
    <text x="346" y="97">arquivo (hot-reload)</text>
    <text x="346" y="119">dado em memória (state / uniform)</text>
    <text x="346" y="141">programa na GPU</text>
    <text x="346" y="163">Visualização (só leitura)</text>
  </g>

  <!-- ================= edges ================= -->
  <!-- solid: fluxo de dados / chamada OpenGL -->
  <g fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M156,96 V126"/>
    <path d="M156,172 V208"/>
    <path d="M156,266 V398"/>
    <path d="M751,94 V124"/>
    <path d="M751,170 V200"/>
    <path d="M751,246 V276"/>
    <path d="M724,330 L708,356"/>
    <path d="M745,410 V430"/>
    <path d="M156,454 V548"/>
    <path d="M690,314 H600 V548"/>
    <path d="M745,484 V548"/>
    <path d="M203,598 V644"/>
    <path d="M458,598 V644"/>
    <path d="M694,598 V644"/>
    <path d="M203,696 V768 H346"/>
    <path d="M458,696 V736"/>
    <path d="M694,696 V768 H576"/>
    <path d="M461,800 V836"/>
  </g>

  <!-- dashed grey: leitura para a Visualização (dead-end) -->
  <g fill="none" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arg)">
    <path d="M280,237 H298 V286 H316"/>
    <path d="M690,300 H574"/>
    <path d="M650,457 H600 V296 H574"/>
  </g>

  <!-- dashed blue: hot-reload (mtime) -->
  <g fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)">
    <path d="M243,172 V208"/>
    <path d="M830,572 H814"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#8b949e" text-anchor="middle">
    <text x="243" y="166" fill="#58a6ff">mtime</text>
    <text x="812" y="558" fill="#58a6ff" text-anchor="end">mtime</text>
    <text x="203" y="629">glUniform1f × 13</text>
    <text x="458" y="629">glTexImage2D</text>
    <text x="694" y="629">glUniform3f</text>
  </g>

  <!-- ================= nós: estádio / pill (fonte · saída) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <rect x="30"  y="42"  width="252" height="54" rx="27"/>
    <rect x="626" y="42"  width="250" height="52" rx="26"/>
    <rect x="346" y="836" width="230" height="48" rx="24"/>
  </g>

  <!-- ================= nós: retângulo arredondado (processo · thread · loop) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <rect x="32"  y="126" width="150" height="46" rx="8"/>
    <rect x="32"  y="208" width="248" height="58" rx="8"/>
    <rect x="626" y="124" width="250" height="46" rx="8"/>
    <rect x="636" y="200" width="230" height="46" rx="8"/>
    <rect x="624" y="356" width="256" height="54" rx="8"/>
    <rect x="74"  y="548" width="740" height="50" rx="10"/>
  </g>

  <!-- ================= nós: documento (arquivo) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <path d="M198,126 H288 V166 C262,176 234,158 198,170 Z"/>
    <path d="M830,544 H946 V592 C914,602 882,584 830,596 Z"/>
  </g>

  <!-- ================= nós: cilindro (dado) ================= -->
  <g fill="#21262d" stroke="#7d8590" stroke-width="1.5">
    <path d="M38,406 V446 A116,8 0 0 0 270,446 V406"/><ellipse cx="154" cy="406" rx="116" ry="8"/>
    <path d="M690,284 V320 A70,8 0 0 0 830,320 V284"/><ellipse cx="760" cy="284" rx="70" ry="8"/>
    <path d="M650,438 V476 A91,8 0 0 0 832,476 V438"/><ellipse cx="741" cy="438" rx="91" ry="8"/>
    <path d="M96,652 V688 A107,8 0 0 0 310,688 V652"/><ellipse cx="203" cy="652" rx="107" ry="8"/>
    <path d="M370,652 V688 A88,8 0 0 0 546,688 V652"/><ellipse cx="458" cy="652" rx="88" ry="8"/>
    <path d="M606,652 V688 A88,8 0 0 0 782,688 V652"/><ellipse cx="694" cy="652" rx="88" ry="8"/>
  </g>

  <!-- ================= nó: hexágono (programa na GPU) ================= -->
  <path d="M370,736 H552 L576,768 L552,800 H370 L346,768 Z" fill="#21262d" stroke="#7d8590" stroke-width="1.5"/>

  <!-- ================= nós: Visualização (tracejado, esmaecido) ================= -->
  <g fill="#21262d" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7">
    <rect x="330" y="218" width="244" height="48" rx="8"/>
    <rect x="330" y="278" width="244" height="44" rx="8"/>
  </g>

  <!-- ================= textos dos nós ================= -->
  <g fill="#e6edf3" text-anchor="middle">
    <g font-size="16">
      <text x="156" y="64">entrada de áudio<tspan x="156" dy="19">(monitor do sistema)</tspan></text>
      <text x="107" y="154">captura (parec)</text>
      <text x="156" y="232">thread de áudio</text>
      <text x="751" y="72">entrada de imagem (OBS)</text>
      <text x="751" y="152">captura (FFMPEG)</text>
      <text x="751" y="228">thread de vídeo</text>
      <text x="444" y="579">loop principal · 30 fps</text>
      <text x="461" y="866">pygame → janela / monitor</text>
    </g>
    <g font-size="15">
      <text x="243" y="153">tuning.py</text>
      <text x="154" y="431">state['amp'] … state['kick']</text>
      <text x="760" y="307">state['frame']</text>
      <text x="741" y="461">state['dominant']</text>
      <text x="452" y="248">imagem · gnome-terminal</text>
      <text x="452" y="305">áudio · stdout</text>
      <text x="203" y="675">u_amp … u_air, u_kick</text>
      <text x="458" y="675">u_texture_0</text>
      <text x="694" y="675">u_dominant</text>
      <text x="888" y="572">image.frag<tspan x="888" dy="17">(arquivo)</tspan></text>
      <text x="461" y="766">image.frag na GPU</text>
    </g>
    <g font-size="14">
      <text x="752" y="388">dominant_color_thread (~10/s)</text>
    </g>
    <g font-size="12.5" fill="#8b949e">
      <text x="156" y="252">FFT · bandas · kick · suavização</text>
      <text x="461" y="784">1× por pixel</text>
    </g>
  </g>

  <!-- ================= legenda de setas ================= -->
  <g font-size="12" fill="#8b949e">
    <line x1="628" y1="822" x2="658" y2="822" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="666" y="826">fluxo de dados / chamada OpenGL</text>
    <line x1="628" y1="844" x2="658" y2="844" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <text x="666" y="848">hot-reload (mtime)</text>
    <line x1="628" y1="866" x2="658" y2="866" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arg)"/>
    <text x="666" y="870">leitura p/ Visualização</text>
  </g>
</svg>
